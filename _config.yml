title: "cnx has spoken"
description: "cnx has spoken"
url: "https://cnx.sh"
baseurl: ""
lang: en
highlighter: rouge

collections:
  my_posts:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_my_posts/en"
    values:
      lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - AGENTS.md
  - README.md
  - assets/js/paper-shaders/README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - node_modules
  - package.json
  - package-lock.json
